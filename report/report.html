<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESD Procedure Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1f4f8;
    --card: #ffffff;
    --ink: #0f1c2e;
    --text: #1f2a37;
    --muted: #4c5a6e;
    --border: #c6d2e0;
    --rowline: #e6ecf4;
    --accent: #1a4e8f;
    --eyebrow: #37649d;
    --navy: #10294b;
    --navy-track: #2c4a70;
    --navy-bar: #6fa8e0;
    --navy-label: #a9bfdb;
    --rust: #a24c2e;
    --green: #17603f;
    --red: #9b2c2c;
    --placeholder: #e9eef4;
    --placeholder-line: #7d91a8;
    --c-marking: #7cb0e3;
    --c-injection: #1d8a8a;
    --c-precut: #2f6bb0;
    --c-dissection: #10294b;
    --serif: "Source Serif 4", "Noto Serif KR", Georgia, serif;
    --sans: "IBM Plex Sans", "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d9dee5; }
  body { font-family: var(--sans); color: var(--text); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .app { display: grid; grid-template-columns: 380px 1fr; min-height: 100vh; }
  .preview { overflow-x: auto; padding: 0 16px; }

  /* ───────── Editor ───────── */
  .editor { background: #fff; border-right: 1px solid var(--border); height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; font-size: 13px; }
  .editor-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--rowline); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .editor-head h2 { font-family: var(--serif); font-size: 18px; color: var(--ink); }
  .editor-head .primary { font: inherit; font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 5px; border: 1px solid var(--navy); background: var(--navy); color: #fff; cursor: pointer; }
  .editor-head .primary:hover { background: var(--accent); border-color: var(--accent); }

  .panel-toggle {
    position: fixed; top: 16px; left: 380px; z-index: 10; width: 22px; height: 44px;
    border: 1px solid var(--border); border-left: 0; border-radius: 0 6px 6px 0; background: #fff;
    color: var(--muted); font: 700 14px/1 var(--sans); cursor: pointer; box-shadow: 2px 1px 4px rgba(16, 41, 75, .08);
  }
  .panel-toggle:hover { color: var(--ink); }
  .app.collapsed { grid-template-columns: 1fr; }
  .app.collapsed .editor { display: none; }
  .app.collapsed .panel-toggle { left: 0; }
  .editor-body { overflow-y: auto; padding: 4px 18px 24px; flex: 1; }

  details { border-bottom: 1px solid var(--rowline); padding: 10px 0; }
  summary { font-weight: 700; color: var(--ink); cursor: pointer; padding: 2px 0; list-style-position: inside; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-top: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field > span { font-size: 11.5px; color: var(--muted); }
  .field input, .field select, .field textarea { font: inherit; font-size: 13px; color: var(--ink); padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; background: #fff; width: 100%; }
  .field textarea { resize: vertical; min-height: 52px; line-height: 1.4; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--navy-bar); outline-offset: -1px; border-color: var(--accent); }
  .field input[readonly] { background: var(--bg); }
  .dur { display: flex; align-items: center; gap: 4px; }
  .dur input { text-align: center; }
  .sub-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--rowline); }
  .sub-head:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .hint { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .img-row { display: flex; gap: 6px; }
  .img-row label, .img-row button { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 5px; background: #fff; cursor: pointer; }
  .img-row input { display: none; }

  /* ───────── Report page ───────── */
  .page {
    width: 210mm; min-height: 297mm; margin: 24px auto; padding: 32px 56px 22px;
    background: var(--bg); display: flex; flex-direction: column;
    box-shadow: 0 2px 16px rgba(16, 41, 75, .15);
  }
  @media (max-width: 1240px) {
    .app { grid-template-columns: 1fr; }
    .editor { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    .editor-body { overflow: visible; }
    .editor-head { padding-left: 34px; }
    .panel-toggle, .app.collapsed .panel-toggle { left: 0; }
  }
  @media print {
    html, body { background: var(--bg); }
    .editor, .panel-toggle { display: none !important; }
    .app { display: block; }
    .preview { padding: 0; overflow: visible; }
    .page { margin: 0; box-shadow: none; height: 297mm; overflow: hidden; }
  }

  .header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 8px; border-bottom: 2px solid var(--accent); }
  .eyebrow { font-size: 11px; letter-spacing: .22em; color: var(--eyebrow); text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 33px; line-height: 1.1; color: var(--ink); letter-spacing: -.005em; }
  .meta { text-align: right; padding-bottom: 14px; }
  .meta .op { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .meta .sub { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  .summary { display: grid; grid-template-columns: 1fr 197px; gap: 14px; margin-top: 16px; }
  .case-card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 22px 20px 18px; }
  .label { font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .case-title { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.17; color: var(--ink); margin-top: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--rowline); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .facts dt { font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
  .facts dd { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.5; }
  .facts dd.rust { color: var(--rust); }
  .facts dd { min-height: 22px; }
  .result { min-height: 52px; }

  .overall { background: var(--navy); border-radius: 6px; padding: 22px 20px; color: #fff; }
  .overall .label { color: var(--navy-label); letter-spacing: .14em; }
  .grade-row { display: flex; align-items: baseline; gap: 14px; margin-top: 8px; }
  .grade { font-family: var(--serif); font-size: 56px; font-weight: 500; line-height: 1; }
  .score { font-size: 19px; font-weight: 700; }
  .score span { font-size: 12px; font-weight: 400; color: var(--navy-label); }
  .bar { height: 6px; border-radius: 3px; background: var(--navy-track); margin-top: 14px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--navy-bar); }
  .cohort { font-size: 12px; line-height: 1.5; color: #c9d6e8; margin-top: 10px; }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .section-head h2 { font-family: var(--serif); font-weight: 600; font-size: 20px; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .section-head h2::before { content: ""; width: 9px; height: 9px; background: var(--accent); }
  .section-head .aside { font-size: 11.5px; color: var(--muted); }

  .phases { display: grid; grid-template-columns: 1fr 207px; gap: 20px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11.5px; font-weight: 400; color: var(--muted); text-align: left; padding: 12px 2px 6px; border-bottom: 1px solid var(--rowline); }
  td { font-size: 13.5px; padding: 8px 2px; border-bottom: 1px solid var(--rowline); font-variant-numeric: tabular-nums; }
  th:nth-child(2), td:nth-child(2) { text-align: center; }
  th:nth-child(3), td:nth-child(3) { text-align: center; }
  th:nth-child(4), td:nth-child(4) { text-align: right; }
  td:nth-child(3), td:nth-child(4) { font-weight: 600; }
  td:first-child { font-weight: 600; color: var(--ink); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 9px; vertical-align: -1px; }

  .donut-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 12px; }
  .donut-wrap svg { width: 140px; height: 140px; display: block; }
  .legend { display: grid; grid-template-columns: auto auto auto auto; column-gap: 8px; row-gap: 6px; margin-top: 14px; font-size: 11.5px; align-items: center; width: 100%; }
  .legend b { font-weight: 600; text-align: right; }
  .legend span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend .sw { margin: 0; width: 8px; height: 8px; }

  .comments { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 2px 16px; margin-top: 16px; }
  .comments li { list-style: none; display: grid; grid-template-columns: 110px 1fr; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rowline); font-size: 12px; line-height: 1.45; }
  .comments li:last-child { border-bottom: 0; }
  .comments strong { font-size: 12.5px; color: var(--ink); display: flex; align-items: center; gap: 9px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .outcome { display: grid; grid-template-columns: 271px 1fr; gap: 19px; margin-top: 10px; }
  .scan { border: 1px dashed var(--placeholder-line); border-radius: 6px; background: var(--placeholder); height: 172px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: hidden; }
  .scan.has-img { border-style: solid; border-color: var(--border); background: #fff; }
  .scan img { width: 100%; height: 100%; object-fit: contain; }
  .scan .ph-label { font-size: 11px; color: var(--muted); }
  .caption { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
  .results { display: flex; flex-direction: column; gap: 6px; }
  .result { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .result h3 { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .result p { font-size: 11.5px; color: var(--muted); line-height: 1.45; margin-top: 3px; }
  .badge { flex: none; font-size: 12px; font-weight: 700; color: #fff; padding: 5px 12px; border-radius: 3px; }
  .badge.good { background: var(--green); }
  .badge.warn { background: var(--rust); }
  .badge.bad { background: var(--red); }
  .badge.pending { background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .footer { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .spacer { min-height: 18px; }
</style>
</head>
<body>

<div class="app">
  <aside class="editor" aria-label="보고서 입력">
    <div class="editor-head">
      <h2>시술 정보 입력</h2>
      <button type="button" class="primary" id="btn-print">PDF로 저장</button>
    </div>
    <div class="editor-body" id="editor"></div>
  </aside>
  <button type="button" class="panel-toggle" id="panel-toggle" aria-label="입력 패널 숨기기" aria-expanded="true">&lt;</button>
  <div class="preview"><main class="page" id="page"></main></div>
</div>

<script>
(function () {
  var STORAGE_KEY = "esd-report-draft-v1";
  var PHASE_COLORS = { marking: "--c-marking", injection: "--c-injection", precut: "--c-precut", dissection: "--c-dissection" };
  var DIFFICULTY_LABELS = { 1: "Very low", 2: "Low", 3: "Moderate", 4: "High", 5: "Very high" };
  // status → [badge text, style, 입력창 표시명]. pending: 병리(R0)·영상(free air)처럼 시술 직후엔 확정 안 되는 항목용.
  var STATUS = {
    achieved:     ["Achieved", "good", "달성"],
    not_achieved: ["Not achieved", "bad", "미달성"],
    none:         ["None", "good", "없음"],
    minor:        ["Minor", "warn", "경미"],
    moderate:     ["Moderate+", "bad", "중등도 이상"],
    present:      ["Present", "bad", "있음"],
    pending:      ["Pending", "pending", "확인 대기"]
  };
  // 결과 항목별로 고를 수 있는 상태 (채점 기준 슬라이드 3번)
  var OUTCOME_OPTIONS = [
    ["achieved", "not_achieved", "pending"],
    ["achieved", "not_achieved", "pending"],
    ["none", "minor", "moderate", "pending"],
    ["none", "present", "pending"]
  ];

  var defaults = normalize(JSON.parse(document.getElementById("report-data").textContent));
  var state = load() || clone(defaults);

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  // 빠진 값(null)이 있어도 입력창·렌더가 깨지지 않도록 형태만 맞춘다
  function normalize(d) {
    d.case = d.case || {};
    if (!Array.isArray(d.case.lesion_size_mm)) d.case.lesion_size_mm = [null, null];
    d.overall = d.overall || {};
    return d;
  }
  // 입력 초안은 기본 데이터가 같을 때만 복원한다. 데이터(sample_case.json)가 바뀌면 새 데이터가 우선.
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      return s && s.base === JSON.stringify(defaults) ? normalize(s.state) : null;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ base: JSON.stringify(defaults), state: state })); } catch (e) { /* 저장 불가 환경(시크릿 등)은 무시 */ }
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }

  // 채점 기준: A+ A0 A− … C0 C− 5점 단위, 그 아래 F
  function gradeFor(score) {
    var bands = [[95, "A+"], [90, "A0"], [85, "A−"], [80, "B+"], [75, "B0"], [70, "B−"], [65, "C+"], [60, "C0"], [55, "C−"]];
    for (var i = 0; i < bands.length; i++) if (score >= bands[i][0]) return bands[i][1];
    return "F";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v, fallback) { var n = parseFloat(v); return isFinite(n) ? n : fallback; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function mmss(sec) { return pad(Math.floor(sec / 60)) + " : " + pad(Math.round(sec % 60)); }
  function color(key) { return "var(" + (PHASE_COLORS[key] || "--muted") + ")"; }

  /* ───────── Report ───────── */
  function donut(phases, total) {
    var r = 56, c = 2 * Math.PI * r, offset = 0, arcs = "";
    phases.forEach(function (p) {
      var len = total ? (p.duration_sec / total) * c : 0;
      arcs += '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="' + color(p.key) + '" stroke-width="27"' +
        ' stroke-dasharray="' + len.toFixed(2) + " " + (c - len).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '"' +
        ' transform="rotate(-90 70 70)"/>';
      offset += len;
    });
    if (!total) arcs = '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="var(--rowline)" stroke-width="27"/>';
    return '<svg viewBox="0 0 140 140" role="img" aria-label="Phase time share">' + arcs +
      '<text x="70" y="64" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--sans)">Total time</text>' +
      '<text x="70" y="85" text-anchor="middle" font-size="19" font-weight="600" fill="var(--ink)" font-family="var(--serif)">' + (total % 60 ? Math.floor(total / 60) + ":" + pad(total % 60) : total / 60 + " min") + "</text></svg>";
  }

  function render(d) {
    var total = d.phases.reduce(function (a, p) { return a + p.duration_sec; }, 0);
    var share = function (p) { return total ? Math.round((p.duration_sec / total) * 100) : 0; };
    var size = d.case.lesion_size_mm || [];
    var sizeText = isNum(size[0]) && isNum(size[1]) ? size[0] + " × " + size[1] + " mm" : "";
    var diffText = isNum(d.case.difficulty_level) ? d.case.difficulty_label + " (Level " + d.case.difficulty_level + " / 5)" : "";
    var o = d.overall, overallHtml;
    if (isNum(o.score)) {
      overallHtml = '<span class="grade">' + esc(o.grade) + '</span><span class="score">' + o.score + " <span>/ 100</span></span></div>" +
        '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, o.score)) + '%"></i></div>' +
        '<div class="cohort">' + (isNum(o.percentile_top) ? "Top " + o.percentile_top + "% in matched difficulty cohort" : "Cohort percentile pending") + "</div>";
    } else {
      // 종합 점수(100점)가 아직 없으면 시술 과정 점수만 보여준다
      var pmax = isNum(o.process_max) ? o.process_max : 40, ps = isNum(o.process_score) ? o.process_score : null;
      overallHtml = '<span class="score">' + (ps == null ? "" : ps) + " <span>/ " + pmax + " process score</span></span></div>" +
        '<div class="bar"><i style="width:' + (ps == null ? 0 : Math.max(0, Math.min(100, ps / pmax * 100))) + '%"></i></div>' +
        '<div class="cohort">' + esc(o.verdict || "") + "</div>";
    }

    var rows = d.phases.map(function (p) {
      return "<tr><td><span class=\"sw\" style=\"background:" + color(p.key) + "\"></span>" + esc(p.name) + "</td>" +
        "<td>" + mmss(p.duration_sec) + "</td><td>" + share(p) + " %</td><td>" + (isNum(p.score) ? p.score.toFixed(1) : "") + "</td></tr>";
    }).join("");

    var legend = d.phases.map(function (p) {
      return '<span><i class="sw" style="background:' + color(p.key) + '"></i>' + esc(p.name) + "</span><b>" + share(p) + "%</b>";
    }).join("");

    var comments = d.phases.map(function (p) {
      return '<li><strong><i class="dot" style="background:' + color(p.key) + '"></i>' + esc(p.name) + "</strong><span>" + esc(p.comment) + "</span></li>";
    }).join("");

    var results = d.outcomes.map(function (o) {
      var s = o.status ? STATUS[o.status] || [o.status, "pending"] : null;
      return '<div class="result"><div><h3>' + esc(o.name) + "</h3>" + (o.detail ? "<p>" + esc(o.detail) + "</p>" : "") + "</div>" + (s ? '<span class="badge ' + s[1] + '">' + esc(s[0]) + "</span>" : "") + "</div>";
    }).join("");

    var scan = d.specimen_scan_image
      ? '<img src="' + esc(d.specimen_scan_image) + '" alt="3D scan of resected specimen">'
      : '<svg width="140" height="80" viewBox="0 0 140 80" aria-hidden="true">' +
          '<ellipse cx="70" cy="40" rx="64" ry="36" fill="#d5dfeb" stroke="var(--placeholder-line)" stroke-width="1"/>' +
          '<ellipse cx="70" cy="40" rx="44" ry="24" fill="none" stroke="var(--placeholder-line)" stroke-width="1"/>' +
          '<ellipse cx="70" cy="40" rx="24" ry="12" fill="none" stroke="var(--placeholder-line)" stroke-width="1"/>' +
          '<path d="M0 40H140M70 0V80" stroke="var(--placeholder-line)" stroke-width="1" stroke-dasharray="4 3"/></svg>' +
        '<span class="ph-label">[ 3D scan of resected specimen ]</span>';

    document.getElementById("page").innerHTML =
      '<header class="header"><div><div class="eyebrow">Endoscopic Submucosal Dissection</div><h1>Procedure Assessment Report</h1></div>' +
      '<div class="meta"><div class="op">Operator : ' + esc(d.operator) + '</div><div class="sub">Date ' + esc(d.date) + " · Case ID " + esc(d.case_id) + "</div></div></header>" +

      '<section class="summary"><div class="case-card"><div class="label">Case</div><div class="case-title">' + esc(d.case.title) + "</div>" +
      '<dl class="facts"><div><dt>Location</dt><dd>' + esc(d.case.location) + "</dd></div>" +
      "<div><dt>Lesion size</dt><dd>" + esc(sizeText) + "</dd></div>" +
      '<div><dt>Overall difficulty</dt><dd' + (isNum(d.case.difficulty_level) ? ' class="rust"' : "") + ">" + esc(diffText) + "</dd></div></dl></div>" +
      '<div class="overall"><div class="label">Overall assessment</div><div class="grade-row">' + overallHtml + "</div></section>" +

      '<div class="section-head"><h2>Procedure Phase Assessment</h2><span class="aside">Total procedure time ' + Math.floor(total / 60) + " min " + pad(total % 60) + " s</span></div>" +
      '<section class="phases"><table><thead><tr><th>Phase</th><th>Duration</th><th>Share</th><th>Score</th></tr></thead><tbody>' + rows + "</tbody></table>" +
      '<div class="donut-wrap">' + donut(d.phases, total) + '<div class="legend">' + legend + "</div></div></section>" +
      '<ul class="comments">' + comments + "</ul>" +

      '<div class="section-head"><h2>Resection Outcome</h2></div>' +
      '<section class="outcome"><div><div class="scan' + (d.specimen_scan_image ? " has-img" : "") + '">' + scan + '</div><p class="caption">Fig. 1 3D scan of the resected specimen · depth distribution and margin measurement</p></div>' +
      '<div class="results">' + results + "</div></section>" +

      '<div class="spacer"></div><footer class="footer"><span>' + esc(d.footer) + "</span><span>1 / 1</span></footer>";
  }

  /* ───────── Editor ───────── */
  function field(label, html, full) {
    return '<label class="field' + (full ? " full" : "") + '"><span>' + label + "</span>" + html + "</label>";
  }
  function input(path, value, attrs) {
    return '<input data-path="' + path + '" value="' + esc(value) + '" ' + (attrs || 'type="text"') + ">";
  }
  function textarea(path, value) {
    return '<textarea data-path="' + path + '">' + esc(value) + "</textarea>";
  }
  function select(path, value, options) {
    return '<select data-path="' + path + '">' + options.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(value) ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }).join("") + "</select>";
  }

  function buildEditor() {
    var d = state, html = "";

    html += '<details open><summary>기본 정보</summary><div class="fields">' +
      field("시술자", input("operator", d.operator), true) +
      field("시술일", input("date", d.date, 'type="date"')) +
      field("Case ID", input("case_id", d.case_id)) +
      "</div></details>";

    html += '<details open><summary>케이스</summary><div class="fields">' +
      field("진단명 (제목)", input("case.title", d.case.title), true) +
      field("병변 부위", input("case.location", d.case.location), true) +
      field("병변 크기 가로 (mm)", input("case.lesion_size_mm.0", d.case.lesion_size_mm[0], 'type="number" min="0" step="1"')) +
      field("병변 크기 세로 (mm)", input("case.lesion_size_mm.1", d.case.lesion_size_mm[1], 'type="number" min="0" step="1"')) +
      field("종합 난이도", select("case.difficulty_level", d.case.difficulty_level, [["", "(비움)"]].concat([1, 2, 3, 4, 5].map(function (n) { return [n, "Level " + n + " · " + DIFFICULTY_LABELS[n]]; }))), true) +
      "</div></details>";

    html += '<details open><summary>종합 평가</summary><div class="fields">' +
      field("점수 (0–100)", input("overall.score", d.overall.score, 'type="number" min="0" max="100" step="0.5"')) +
      field("등급 (점수로 자동)", '<input id="grade-out" value="' + esc(d.overall.grade) + '" readonly tabindex="-1">') +
      field("동일 난이도군 상위 (%)", input("overall.percentile_top", d.overall.percentile_top, 'type="number" min="0" max="100" step="1"'), true) +
      "</div></details>";

    html += '<details open><summary>시술 단계 (소요시간 · 점수 · 코멘트)</summary><div class="fields">';
    d.phases.forEach(function (p, i) {
      var m = Math.floor(p.duration_sec / 60), s = p.duration_sec % 60;
      html += '<div class="sub-head"><i class="sw" style="margin:0;background:' + color(p.key) + '"></i>' + esc(p.name) + "</div>" +
        field("소요시간 (분 : 초)", '<span class="dur">' +
          '<input data-dur="' + i + '" data-unit="m" type="number" min="0" step="1" value="' + m + '" aria-label="' + esc(p.name) + ' 분">:' +
          '<input data-dur="' + i + '" data-unit="s" type="number" min="0" max="59" step="1" value="' + s + '" aria-label="' + esc(p.name) + ' 초"></span>') +
        field("점수 (10점 만점)", input("phases." + i + ".score", p.score, 'type="number" min="0" max="10" step="0.1"')) +
        field("코멘트", textarea("phases." + i + ".comment", p.comment), true);
    });
    html += '<p class="hint">비중(%)과 총 시술시간, 도넛 차트는 소요시간으로 자동 계산됩니다.</p></div></details>';

    html += '<details open><summary>시술 결과</summary><div class="fields">';
    d.outcomes.forEach(function (o, i) {
      var opts = [["", "(비움)"]].concat((OUTCOME_OPTIONS[i] || Object.keys(STATUS)).map(function (k) { return [k, STATUS[k][2] + " (" + STATUS[k][0] + ")"]; }));
      html += '<div class="sub-head">' + esc(o.name) + "</div>" +
        field("판정", select("outcomes." + i + ".status", o.status, opts), true) +
        field("세부 내용", input("outcomes." + i + ".detail", o.detail), true);
    });
    html += "</div></details>";

    html += '<details open><summary>3D 스캔 이미지 · 기타</summary><div class="fields">' +
      '<div class="field full"><span>절제 표본 3D 스캔</span><div class="img-row">' +
      '<label>이미지 선택<input type="file" id="img-input" accept="image/*"></label>' +
      '<button type="button" id="img-clear">이미지 제거</button></div></div>' +
      field("하단 문구", input("footer", d.footer), true) +
      "</div></details>";

    document.getElementById("editor").innerHTML = html;
  }

  function setPath(obj, path, value) {
    var keys = path.split("."), last = keys.pop();
    keys.forEach(function (k) { obj = obj[k]; });
    obj[last] = value;
  }

  function update() {
    state.case.difficulty_label = DIFFICULTY_LABELS[state.case.difficulty_level] || "";
    state.overall.grade = isNum(state.overall.score) ? gradeFor(state.overall.score) : "";
    var g = document.getElementById("grade-out");
    if (g) g.value = state.overall.grade;
    render(state);
    save();
  }

  var editor = document.getElementById("editor");
  editor.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset.dur != null) {
      var i = +t.dataset.dur;
      var row = editor.querySelectorAll('[data-dur="' + i + '"]');
      var m = Math.max(0, num(row[0].value, 0)), s = Math.max(0, num(row[1].value, 0));
      state.phases[i].duration_sec = Math.round(m * 60 + s);
    } else if (t.dataset.path) {
      var numeric = t.type === "number" || t.tagName === "SELECT" && /difficulty_level/.test(t.dataset.path);
      setPath(state, t.dataset.path, numeric ? num(t.value, null) : t.value);
    } else if (t.id === "img-input" && t.files[0]) {
      var reader = new FileReader();
      reader.onload = function () { state.specimen_scan_image = reader.result; update(); };
      reader.readAsDataURL(t.files[0]);
      t.value = "";
      return;
    } else return;
    update();
  });
  // select는 브라우저에 따라 input 이벤트가 없을 수 있어 change에서도 처리
  editor.addEventListener("change", function (e) {
    var t = e.target;
    if (t.tagName !== "SELECT") return;
    setPath(state, t.dataset.path, /difficulty_level/.test(t.dataset.path) ? num(t.value, null) : t.value);
    update();
  });
  editor.addEventListener("click", function (e) {
    if (e.target.id === "img-clear") { state.specimen_scan_image = null; update(); }
  });

  document.getElementById("btn-print").addEventListener("click", function () { window.print(); });
  var app = document.querySelector(".app"), toggle = document.getElementById("panel-toggle");
  function setCollapsed(c) {
    app.classList.toggle("collapsed", c);
    toggle.textContent = c ? ">" : "<";
    toggle.setAttribute("aria-expanded", String(!c));
    toggle.setAttribute("aria-label", c ? "입력 패널 열기" : "입력 패널 숨기기");
    try { localStorage.setItem(STORAGE_KEY + "-collapsed", c ? "1" : ""); } catch (e) {}
  }
  toggle.addEventListener("click", function () { setCollapsed(!app.classList.contains("collapsed")); });
  try { setCollapsed(localStorage.getItem(STORAGE_KEY + "-collapsed") === "1"); } catch (e) {}

  window.renderReport = function (d) { state = normalize(d); buildEditor(); update(); };
  buildEditor();
  update();

  // nginx 등 웹 서버로 열면 옆의 sample_case.json을 우선 사용 (파일만 바꾸면 보고서가 바뀜).
  // file://로 열면 위의 내장 데이터를 사용.
  if (/^https?:$/.test(location.protocol)) {
    fetch("sample_case.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        defaults = normalize(d);
        state = load() || clone(defaults);
        buildEditor(); update();
      })
      .catch(function (e) { console.warn("sample_case.json 로드 실패, 내장 데이터 사용:", e); });
  }
})();
</script>
</body>
</html>
